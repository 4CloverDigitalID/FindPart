services:
  backend_init:
    build:
      context: ./backend-find-part
      dockerfile: Dockerfile
    container_name: startupmatch-backend-init
    working_dir: /var/www/html
    command: >
      sh -c "if [ ! -f .env ]; then cp .env.example .env; fi &&
             composer install --no-interaction --prefer-dist --no-progress"
    volumes:
      - ./backend-find-part:/var/www/html
      - backend_vendor:/var/www/html/vendor
    networks:
      - startupmatch

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: startupmatch-frontend
    working_dir: /app
    command: >
      sh -c "if [ ! -d node_modules ] || [ -z \"$(ls -A node_modules 2>/dev/null)\" ];
             then npm install;
             fi &&
             npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000/api
      VITE_REVERB_APP_KEY: startupmatch-key
      VITE_REVERB_HOST: localhost
      VITE_REVERB_PORT: 8080
      VITE_REVERB_SCHEME: http
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend
    networks:
      - startupmatch

  backend:
    build:
      context: ./backend-find-part
      dockerfile: Dockerfile
    container_name: startupmatch-backend
    working_dir: /var/www/html
    command: >
      sh -c "if [ ! -f .env ]; then cp .env.example .env; fi &&
             if ! grep -q '^APP_KEY=base64:' .env; then php artisan key:generate --force; fi &&
             php artisan migrate --force &&
             (php artisan storage:link || true) &&
             php artisan serve --host=0.0.0.0 --port=8000"
    ports:
      - "8000:8000"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      FRONTEND_URL: http://localhost:5173
      REVERB_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: startupmatch
      DB_USERNAME: startupmatch
      DB_PASSWORD: startupmatch
      BROADCAST_CONNECTION: reverb
      QUEUE_CONNECTION: database
      REVERB_APP_ID: startupmatch
      REVERB_APP_KEY: startupmatch-key
      REVERB_APP_SECRET: startupmatch-secret
      REVERB_HOST: reverb
      REVERB_PORT: 8080
      REVERB_SCHEME: http
      REVERB_SERVER_HOST: 0.0.0.0
      REVERB_SERVER_PORT: 8080
    volumes:
      - ./backend-find-part:/var/www/html
      - backend_vendor:/var/www/html/vendor
    depends_on:
      backend_init:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
    networks:
      - startupmatch

  reverb:
    build:
      context: ./backend-find-part
      dockerfile: Dockerfile
    container_name: startupmatch-reverb
    working_dir: /var/www/html
    command: >
      sh -c "if [ ! -f .env ]; then cp .env.example .env; fi &&
             php artisan reverb:start --host=0.0.0.0 --port=8080"
    ports:
      - "8080:8080"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      REVERB_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: startupmatch
      DB_USERNAME: startupmatch
      DB_PASSWORD: startupmatch
      BROADCAST_CONNECTION: reverb
      REVERB_APP_ID: startupmatch
      REVERB_APP_KEY: startupmatch-key
      REVERB_APP_SECRET: startupmatch-secret
      REVERB_HOST: reverb
      REVERB_PORT: 8080
      REVERB_SCHEME: http
      REVERB_SERVER_HOST: 0.0.0.0
      REVERB_SERVER_PORT: 8080
    volumes:
      - ./backend-find-part:/var/www/html
      - backend_vendor:/var/www/html/vendor
    depends_on:
      backend_init:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
    networks:
      - startupmatch

  queue:
    build:
      context: ./backend-find-part
      dockerfile: Dockerfile
    container_name: startupmatch-queue
    working_dir: /var/www/html
    command: >
      sh -c "if [ ! -f .env ]; then cp .env.example .env; fi &&
             php artisan queue:work --tries=1 --timeout=0"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: startupmatch
      DB_USERNAME: startupmatch
      DB_PASSWORD: startupmatch
      QUEUE_CONNECTION: database
    volumes:
      - ./backend-find-part:/var/www/html
      - backend_vendor:/var/www/html/vendor
    depends_on:
      backend_init:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
      backend:
        condition: service_started
    networks:
      - startupmatch

  mysql:
    image: mysql:8.4
    container_name: startupmatch-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: startupmatch
      MYSQL_USER: startupmatch
      MYSQL_PASSWORD: startupmatch
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - startupmatch

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:5.2
    container_name: startupmatch-phpmyadmin
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: root
      UPLOAD_LIMIT: 128M
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - startupmatch

volumes:
  mysql_data:
  backend_vendor:
  frontend_node_modules:

networks:
  startupmatch:
    driver: bridge
